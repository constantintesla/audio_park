services:
  api:
    build: .
    image: audio_park-api:latest
    container_name: parkinson_api
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./data/results.json:/app/results.json
      - ./data/results:/app/results
      - ./data/auth:/app/auth
    env_file:
      - .env
    environment:
      - PORT=5000
      - FLASK_ENV=${FLASK_ENV:-production}
      - DEBUG=${DEBUG:-False}
      - HOST=0.0.0.0
      - AUTH_DATA_DIR=/app/auth
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
    restart: unless-stopped
    # Потолок памяти: обычно сервис держит 300-450 МБ, пик анализа 7-минутной
    # записи около 0,9 ГБ. Если что-то пойдет не так, контейнер перезапустится,
    # а соседние сервисы на сервере не пострадают.
    mem_limit: 1536m
    networks:
      - parkinson_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  parkinson_network:
    driver: bridge
