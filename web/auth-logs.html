<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Журнал входов</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/theme.css"><script src="assets/auth.js"></script></head>
<body><header class="app-nav"><div class="container app-nav-inner"><a class="brand" href="./">
                <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2M7 8v8M11 4v16M15 7v10M19 10v4M21 12h0"/></svg></span>
                <span class="brand-text"><strong>Анализ голоса</strong><small>Скрининг признаков болезни Паркинсона</small></span>
            </a><nav class="app-links" aria-label="Разделы"></nav></div></header><main class="container"><h1>Журнал входов</h1><p>События за последние 90 дней. Время показано в вашем часовом поясе.</p><button id="refresh" class="btn btn-primary">Обновить</button><p id="status" role="status"></p><div class="table-wrap"><table class="table"><thead><tr><th>Время</th><th>Логин</th><th>Событие</th><th>Причина</th><th>IP</th></tr></thead><tbody id="events"></tbody></table></div><button id="more" class="btn btn-outline-secondary">Ранее</button></main><script>
let cursor=null;
const labels={login_success:'Успешный вход',login_failed:'Отказ во входе',logout:'Выход',unknown_login:'Логин не найден',inactive_account:'Учётка отключена',wrong_password:'Неверный пароль',rate_limited:'Лимит попыток',csrf_invalid:'Сессия устарела',invalid_password_format:'Некорректный формат пароля'};
async function load(reset=false){const status=document.querySelector('#status');try{const response=await fetch(AudioPark.url('/api/admin/auth-logs')+(!reset&&cursor?'?before='+cursor:''));const data=await response.json();if(!response.ok)throw new Error(data.error);const body=document.querySelector('#events');if(reset)body.replaceChildren();for(const item of data.events){const row=document.createElement('tr');for(const value of [new Date(item.created_at).toLocaleString(),item.login,labels[item.event]||item.event,labels[item.reason]||item.reason,item.ip]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}body.append(row)}cursor=data.events.at(-1)?.id;document.querySelector('#more').disabled=data.events.length<100;status.textContent=body.children.length?'':'Событий пока нет'}catch(error){status.textContent=error.message}}
document.querySelector('#refresh').onclick=()=>load(true);document.querySelector('#more').onclick=()=>load();AudioPark.ready.then(()=>load(true));
</script></body></html>
