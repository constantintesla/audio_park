<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Учётные записи · Анализ голоса</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><link rel="stylesheet" href="assets/theme.css"><script src="assets/auth.js"></script></head>
<body><header class="app-nav"><div class="container app-nav-inner"><a class="brand" href="./"><span class="brand-text"><strong>Анализ голоса</strong><small>Исследования голоса</small></span></a><nav class="app-links" aria-label="Разделы"></nav></div></header>
<main class="container"><div class="page-head"><div><h1>Учётные записи</h1><p>Создание учёток и назначение прав доступа</p></div></div>
<div class="card"><div class="card-header">Новая учётная запись</div><div class="card-body"><form id="create-user"><div class="row g-3">
<div class="col-md-4"><label class="form-label" for="new-login">Электронная почта или логин</label><input id="new-login" class="form-control" required minlength="2" maxlength="200" autocomplete="off"></div>
<div class="col-md-4"><label class="form-label" for="new-password">Пароль</label><input id="new-password" class="form-control" type="password" required minlength="8" maxlength="256" autocomplete="new-password"></div>
<div class="col-md-4"><label class="form-label" for="new-role">Роль</label><select id="new-role" class="form-select"><option value="expert">expert — обследования и свои результаты</option><option value="moderator">moderator — полный доступ</option><option value="admin">admin — полный доступ</option></select></div></div>
<p class="hint mt-3">Создавать учётные записи могут moderator и admin. Expert видит только свои исследования.</p><button class="btn btn-primary" id="create-submit">Создать учётную запись</button><p id="create-status" class="mt-3 mb-0" role="status"></p></form></div></div>
<div class="card"><div class="card-header">Пользователи</div><div class="table-wrap"><table class="table mb-0"><thead><tr><th>ID</th><th>Логин</th><th>Роль</th><th>Статус</th></tr></thead><tbody id="user-list"></tbody></table></div></div></main>
<script>
async function loadUsers(){const response=await fetch(AudioPark.url('/api/users'));const data=await response.json();if(!response.ok)throw new Error(data.error);const body=document.querySelector('#user-list');body.replaceChildren();for(const user of data.users){const row=document.createElement('tr');for(const value of [user.id,user.login,user.role,user.active?'Активна':'Отключена']){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}body.append(row)}}
document.querySelector('#create-user').addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#create-submit');const status=document.querySelector('#create-status');button.disabled=true;status.textContent='';try{const response=await fetch(AudioPark.url('/api/users'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.querySelector('#new-login').value,password:document.querySelector('#new-password').value,role:document.querySelector('#new-role').value})});const data=await response.json();if(!response.ok)throw new Error(data.error);document.querySelector('#create-user').reset();status.className='mt-3 mb-0 text-success';status.textContent='Учётная запись создана';await loadUsers()}catch(error){status.className='mt-3 mb-0 text-danger';status.textContent=error.message}finally{button.disabled=false}});
AudioPark.ready.then(loadUsers).catch(error=>{document.querySelector('#create-status').textContent=error.message});
</script></body></html>
