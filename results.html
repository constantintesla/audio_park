<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты · Анализ голоса</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
    <header class="app-nav">
        <div class="container app-nav-inner">
            <a class="brand" href="./">
                <span class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2M7 8v8M11 4v16M15 7v10M19 10v4M21 12h0"/></svg></span>
                <span class="brand-text"><strong>Анализ голоса</strong><small>Скрининг признаков болезни Паркинсона</small></span>
            </a>
            <nav class="app-links" aria-label="Разделы">
                <a href="./">Обзор</a>
                <a href="./results" class="active" aria-current="page">Результаты</a>
                <a href="./visualization">Визуализация</a>
            </nav>
        </div>
    </header>
    <div class="container">
        <div class="page-head">
            <div>
                <h1>Результаты</h1>
                <p>Все сохраненные анализы голоса, новые сверху</p>
            </div>
            <div class="toolbar">
                <small class="text-muted" id="results-count">Загрузка...</small>
                <button id="refresh-btn" class="btn btn-outline-secondary">Обновить</button>
            </div>
        </div>
        
        <div id="results-list"></div>
        
        <!-- Loading indicator -->
        <div id="loading-indicator" class="text-center" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Загрузка...</span>
            </div>
            <p class="mt-2">Загрузка результатов...</p>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>Система предназначена для исследовательских целей и не заменяет медицинскую диагностику.</p>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Префикс пути, чтобы страница работала и в корне, и за прокси (например /audio_park)
        const API_URL = window.location.pathname.replace(/\/(index\.html|results|visualization)?\/?$/, '');
        
        // Инициализация при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            initRefreshButton();
            loadResults();
        });
        
        function initRefreshButton() {
            document.getElementById('refresh-btn').addEventListener('click', () => {
                loadResults();
            });
        }
        
        async function loadResults() {
            const loadingIndicator = document.getElementById('loading-indicator');
            const resultsList = document.getElementById('results-list');
            
            if (loadingIndicator) {
                loadingIndicator.style.display = 'block';
            }
            if (resultsList) {
                resultsList.innerHTML = '';
            }
            
            try {
                const response = await fetch(`${API_URL}/api/results`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    // Обновляем счетчик
                    const resultsCount = document.getElementById('results-count');
                    if (resultsCount) {
                        resultsCount.textContent = `Всего: ${data.results.length}`;
                    }
                    
                    // Сортируем по дате (новые первыми)
                    const sortedResults = [...data.results].sort((a, b) => {
                        const dateA = new Date(a.user_info?.timestamp || 0);
                        const dateB = new Date(b.user_info?.timestamp || 0);
                        return dateB - dateA;
                    });
                    
                    // Отображаем детальные карточки
                    sortedResults.forEach((result, index) => {
                        const resultCard = createResultCard(result, index);
                        if (resultsList) {
                            resultsList.appendChild(resultCard);
                        }
                    });
                } else {
                    const resultsCount = document.getElementById('results-count');
                    if (resultsCount) {
                        resultsCount.textContent = 'Нет результатов';
                    }
                    if (resultsList) {
                        resultsList.innerHTML = `
                            <div class="alert alert-info text-center">
                                <h5>Пока нет результатов анализа</h5>
                                <p class="mb-0">Результаты появятся здесь после анализа аудиозаписи через веб-интерфейс или локального анализа.</p>
                            </div>
                        `;
                    }
                }
            } catch (e) {
                console.error('Ошибка загрузки результатов:', e);
                if (resultsList) {
                    resultsList.innerHTML = `
                        <div class="alert alert-danger">
                            <h5>Ошибка загрузки результатов</h5>
                            <p>${e.message}</p>
                            <p class="mb-0"><small>Проверьте, что API сервер запущен и доступен по адресу ${API_URL || 'текущий домен'}</small></p>
                        </div>
                    `;
                }
            } finally {
                if (loadingIndicator) {
                    loadingIndicator.style.display = 'none';
                }
            }
        }
        
        function createResultCard(result, index) {
            const card = document.createElement('div');
            card.className = 'card result-card';
            
            const userInfo = result.user_info || {};
            const username = userInfo.tg_username || 'Неизвестный пользователь';
            const timestamp = userInfo.timestamp || '';
            const dsi = result.dsi || {};
            const dsiScore = dsi.dsi_score;
            const symptomScores = result.symptom_scores || {};
            const pdRisk = symptomScores.pd_risk || 'Не определен';
            
            // Форматирование даты
            let dateStr = 'Дата неизвестна';
            let dateObj = null;
            if (timestamp) {
                try {
                    dateObj = new Date(timestamp);
                    dateStr = dateObj.toLocaleString('ru-RU', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } catch (e) {
                    dateStr = timestamp;
                }
            }
            
            // Определение цвета риска
            let riskClass = 'risk-low';
            if (pdRisk.includes('Высокий')) {
                riskClass = 'risk-high';
            } else if (pdRisk.includes('Умеренный')) {
                riskClass = 'risk-medium';
            }
            
            // Краткая информация для заголовка
            const shortInfo = dsiScore !== null && dsiScore !== undefined 
                ? `DSI ${dsiScore.toFixed(2)}` 
                : '';
            
            card.innerHTML = `
                <div class="card-header d-flex justify-content-between align-items-center" onclick="toggleResult(${index})">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center gap-2">
                            <h5 class="mb-0">${username}</h5>
                            <span class="table-badge ${riskClass}">${pdRisk.split('(')[0].trim()}</span>
                        </div>
                        <div class="mt-1 result-meta">
                            ${dateStr}${shortInfo ? ` · ${shortInfo}` : ''}
                        </div>
                    </div>
                    <div class="d-flex gap-2 align-items-center">
                        <button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation(); openVisualization(${index})" title="Открыть визуализацию">
                            Графики
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation(); toggleResult(${index})">
                            <span id="toggle-icon-${index}">▼</span>
                        </button>
                    </div>
                </div>
                <div class="card-body" id="result-content-${index}" style="display: none;">
                    ${createResultContent(result)}
                </div>
            `;
            
            // Сохраняем индекс в data-атрибуте для правильной работы toggle
            card.setAttribute('data-index', index);
            
            return card;
        }
        
        function createResultContent(result) {
            const dsi = result.dsi || {};
            const dsiScore = dsi.dsi_score;
            const symptomScores = result.symptom_scores || {};
            const pdRisk = symptomScores.pd_risk || 'Не определен';
            const features = result.features || {};
            const jitterRaw = features.jitter_percent ?? 0;
            const jitterCapped = (features.jitter_percent_capped !== undefined && features.jitter_percent_capped !== null)
                ? features.jitter_percent_capped
                : Math.min(jitterRaw, 5.0);
            
            let html = '';
            
            // DSI Section
            html += renderDsiCard(dsi);
            
            // Jitter, shimmer и HNR по обычной речи не оцениваются (нормы - для протяжной гласной)
            const voiceQualityFromSpeech = result.recording_task === 'speech';
            const speechNote = '<small class="text-muted">по речи не оценивается, нужна протяжная гласная</small>';
            
            function formatWithReference(value, paramName, muted = false) {
                if (muted) return `${value.toFixed(2)} ${speechNote}`;
                const refRanges = getReferenceRanges();
                if (!refRanges[paramName]) return value.toFixed(2);
                
                const ref = refRanges[paramName];
                const [normalMin, normalMax] = ref.normal;
                const unit = ref.unit;
                
                let statusIcon = '';
                let statusClass = '';
                if (normalMin <= value && value <= normalMax) {
                    statusIcon = '<span class="dot dot-ok"></span>';
                    statusClass = 'text-success';
                } else if (value < normalMin) {
                    statusIcon = '<span class="dot dot-risk"></span>';
                    statusClass = 'text-danger';
                } else {
                    statusIcon = '<span class="dot dot-risk"></span>';
                    statusClass = 'text-danger';
                }
                
                return `<span class="${statusClass}">${value.toFixed(2)} ${unit} ${statusIcon}</span> <small class="text-muted">(норма: ${normalMin.toFixed(1)}-${normalMax.toFixed(1)} ${unit})</small>`;
            }
            
            // Features Table
            html += `
                <h5>Акустические признаки</h5>
                <table class="feature-table table table-sm table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>Признак</th>
                            <th>Значение</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><strong>Jitter</strong></td>
                            <td>${formatWithReference(features.jitter_percent || 0, 'jitter_percent', voiceQualityFromSpeech)}</td>
                        </tr>
                        <tr>
                            <td><strong>Jitter (cap 5%)</strong></td>
                            <td>${formatWithReference(jitterCapped, 'jitter_percent', voiceQualityFromSpeech)}</td>
                        </tr>
                        <tr>
                            <td><strong>Shimmer</strong></td>
                            <td>${formatWithReference(features.shimmer_percent || 0, 'shimmer_percent', voiceQualityFromSpeech)}</td>
                        </tr>
                        <tr>
                            <td><strong>HNR</strong></td>
                            <td>${formatWithReference(features.hnr_db || 0, 'hnr_db', voiceQualityFromSpeech)}</td>
                        </tr>
                        <tr>
                            <td><strong>F0 Mean</strong></td>
                            <td>${formatWithReference(features.f0_mean_hz || 0, 'f0_mean_hz')}</td>
                        </tr>
                        <tr>
                            <td><strong>F0 SD</strong></td>
                            <td>${formatWithReference(features.f0_sd_hz || 0, 'f0_sd_hz')}</td>
                        </tr>
                        <tr>
                            <td><strong>Темп (слогов/сек без пауз)</strong></td>
                            <td>${formatWithReference(features.rate_syl_sec || 0, 'rate_syl_sec')}</td>
                        </tr>
                    </tbody>
                </table>
            `;
            
            // Symptom Scores
            html += `
                <h5 class="mt-4">Оценка симптомов (0-3)</h5>
                <div class="mb-3">
            `;
            
            const symptomNames = {
                hypophonia: 'Гипофония',
                monopitch: 'Monopitch',
                monoloudness: 'Monoloudness',
                hoarseness: 'Охриплость',
                imprecise_articulation: 'Неточная артикуляция'
            };
            
            for (const [key, name] of Object.entries(symptomNames)) {
                html += `<div class="mb-2"><strong>${name}:</strong> ${renderSymptomScore(symptomScores[key])}</div>`;
            }
            
            html += '</div>';
            
            // Report
            if (result.report && result.report.length > 0) {
                html += `
                    <h5 class="mt-4">Отчет</h5>
                    <div class="report-list">
                        <ul>
                `;
                result.report.forEach(item => {
                    html += `<li>${item}</li>`;
                });
                html += `
                        </ul>
                    </div>
                `;
            }
            
            return html;
        }
        
        function toggleResult(index) {
            const content = document.getElementById(`result-content-${index}`);
            const icon = document.getElementById(`toggle-icon-${index}`);
            
            if (!content || !icon) return;
            
            if (content.style.display === 'none' || content.style.display === '') {
                content.style.display = 'block';
                icon.textContent = '▼';
            } else {
                content.style.display = 'none';
                icon.textContent = '▶';
            }
        }
        
        function openVisualization(index) {
            window.location.href = `${API_URL}/visualization?index=${index}`;
        }
        
        // Reference ranges function
        // Оценка симптома 0-3; null - симптом не оценивался по этому типу записи
        function renderSymptomScore(score) {
            if (score === null || score === undefined) {
                return '<small class="text-muted">не оценивался по этой записи</small>';
            }
            return `<span class="symptom-score score-${score}">${score}</span>
                <small class="text-muted">(${['Нет', 'Легкий', 'Умеренный', 'Тяжелый'][score] || 'N/A'})</small>`;
        }
        
        // Карточка DSI. DSI считается только по специальным заданиям с калибровкой
        // микрофона, иначе показываем, почему его нет.
        function renderDsiCard(dsi) {
            const dsiScore = dsi ? dsi.dsi_score : null;
            if (dsiScore === null || dsiScore === undefined) {
                const reason = dsi && (dsi.reason || dsi.error);
                if (!reason) return '';
                return `
                    <div class="alert alert-secondary mt-3 mb-3">
                        <strong>DSI не рассчитан.</strong> ${reason}
                    </div>
                `;
            }
            const breakdown = dsi.dsi_breakdown || {};
            const interpretation = dsi.interpretation || {};
            const dot = dsiScore >= 1.6 ? 'dot-ok' : dsiScore >= 0.0 ? 'dot-warn' : dsiScore >= -2.0 ? 'dot-mid' : 'dot-risk';
            const row = (name, value, status) => `
                <tr><td><strong>${name}</strong></td><td>${value}</td><td><small>${status || 'N/A'}</small></td></tr>`;
            return `
                <div class="card mt-3 mb-3">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">DSI (Dysphonia Severity Index)</h5>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <h2 class="display-4">${dsiScore.toFixed(2)}</h2>
                            <p class="lead"><span class="dot ${dot}"></span> ${dsi.dsi_range || ''}</p>
                            <p class="text-muted"><small>Здоровый голос: около +1.6 и выше (шкала от -5 до +5)</small></p>
                        </div>
                        <table class="table table-sm table-bordered">
                            <thead class="table-light"><tr><th>Параметр</th><th>Значение</th><th>Оценка</th></tr></thead>
                            <tbody>
                                ${row('MPT, сек (норма 15-30)', (breakdown.mpt_sec || 0).toFixed(2), interpretation.mpt_status)}
                                ${row('F0-High, Гц (норма 400-600)', (breakdown.f0_high_hz || 0).toFixed(1), interpretation.f0_high_status)}
                                ${row('I-Low, дБ SPL (норма до 45)', (breakdown.i_low_db || 0).toFixed(1), interpretation.i_low_status)}
                                ${row('Jitter, % (норма до 1.0)', (breakdown.jitter_percent || 0).toFixed(2), interpretation.jitter_status)}
                            </tbody>
                        </table>
                        <div class="alert alert-info mb-0" role="alert">
                            <small>
                                <strong>Формула:</strong> ${dsi.formula || 'DSI = 0.13 × MPT + 0.0053 × F0-High - 0.26 × I-Low - 1.18 × Jitter(%) + 12.4'}<br>
                                ${interpretation.note || 'DSI оценивает качество голоса, а не болезнь Паркинсона, и не является диагнозом.'}
                            </small>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function getReferenceRanges() {
            return {
                'jitter_percent': {normal: [0.0, 1.0], unit: '%'},
                'shimmer_percent': {normal: [0.0, 4.0], unit: '%'},
                'hnr_db': {normal: [20.0, 40.0], unit: 'дБ'},
                'f0_mean_hz': {normal: [100.0, 300.0], unit: 'Гц'},
                'f0_sd_hz': {normal: [10.0, 50.0], unit: 'Гц'},
                'rate_syl_sec': {normal: [4.5, 7.0], unit: 'сл/сек'},
                'mpt_sec': {normal: [15.0, 30.0], unit: 'сек'},
                'f0_high_hz': {normal: [400.0, 600.0], unit: 'Гц'},
                'i_low_db': {normal: [25.0, 45.0], unit: 'дБ'},
                'dsi_score': {normal: [1.6, 5.0], unit: ''}
            };
        }
    </script>
</body>
</html>
