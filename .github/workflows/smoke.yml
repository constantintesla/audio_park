name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-runner
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Доступ к PyPI с lab-сервера нестабилен, поэтому venv живёт вне рабочей
      # папки и пересоздаётся только при изменении requirements.txt
      - name: Prepare cached venv
        run: |
          key=$(sha256sum requirements.txt | cut -c1-16)
          venv="$HOME/.cache/audio_park-ci/venv-$key"
          if [ ! -f "$venv/.ready" ]; then
            rm -rf "$venv"
            python3 -m venv "$venv"
            "$venv/bin/python" -m pip install --retries 10 --timeout 60 -r requirements.txt
            touch "$venv/.ready"
          fi
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Smoke check
        env:
          MPLBACKEND: Agg
        run: '"$VENV/bin/python" scripts/ci_smoke.py'

  # Выкладка на lab-сервер (https://msr25.ru/audio_park/) после зелёного smoke в main.
  # Данные (results.json, results/) и .env лежат в ~/audio_park и не трогаются.
  deploy:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t audio_park-api:latest .

      - name: Restart container
        run: docker compose -p audio_park -f docker-compose.prod.yml --project-directory "$HOME/audio_park" up -d --no-build

      - name: Wait for the app
        run: |
          for i in $(seq 1 30); do
            if wget -q -O /dev/null http://127.0.0.1:5005/api/stats; then
              echo "app is up"; exit 0
            fi
            sleep 2
          done
          docker logs --tail 50 parkinson_api
          exit 1
