name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-runner
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Доступ к PyPI с lab-сервера нестабилен, поэтому venv живёт вне рабочей
      # папки и пересоздаётся только при изменении requirements.txt
      - name: Prepare cached venv
        run: |
          key=$(sha256sum requirements.txt | cut -c1-16)
          venv="$HOME/.cache/audio_park-ci/venv-$key"
          if [ ! -f "$venv/.ready" ]; then
            rm -rf "$venv"
            python3 -m venv "$venv"
            "$venv/bin/python" -m pip install --retries 10 --timeout 60 -r requirements.txt
            touch "$venv/.ready"
          fi
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Smoke check
        env:
          MPLBACKEND: Agg
        run: '"$VENV/bin/python" scripts/ci_smoke.py'
