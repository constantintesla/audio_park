name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Create venv and install dependencies
        run: |
          py -3.10 -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt

      - name: Smoke check
        env:
          PYTHONIOENCODING: utf-8
          MPLBACKEND: Agg
        run: .venv\Scripts\python scripts\ci_smoke.py
