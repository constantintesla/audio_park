name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-runner
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Доступ к PyPI с lab-сервера нестабилен, поэтому venv живёт вне рабочей
      # папки и пересоздаётся только при изменении requirements.txt
      - name: Prepare cached venv
        run: |
          key=$(sha256sum requirements.txt | cut -c1-16)
          venv="$HOME/.cache/audio_park-ci/venv-$key"
          if [ ! -f "$venv/.ready" ]; then
            rm -rf "$venv"
            python3 -m venv "$venv"
            "$venv/bin/python" -m pip install --retries 10 --timeout 60 -r requirements.txt
            touch "$venv/.ready"
          fi
          echo "VENV=$venv" >> "$GITHUB_ENV"

      - name: Smoke check
        env:
          MPLBACKEND: Agg
        run: |
          "$VENV/bin/python" scripts/test_results_storage.py
          "$VENV/bin/python" scripts/test_access.py
          "$VENV/bin/python" scripts/test_uploads.py
          if command -v node >/dev/null 2>&1; then
            node scripts/test_recorder.cjs
            node scripts/test_upload_client.cjs
            node scripts/test_upload_recovery.cjs
            node scripts/test_exam_file_ui.cjs
            node scripts/test_upload_logs.cjs
            node scripts/test_visualization_player.cjs
          else
            docker run --rm -v "$PWD:/workspace:ro" -w /workspace node:22-alpine \
              sh -c 'node scripts/test_recorder.cjs && node scripts/test_upload_client.cjs && node scripts/test_upload_recovery.cjs && node scripts/test_exam_file_ui.cjs && node scripts/test_upload_logs.cjs && node scripts/test_visualization_player.cjs'
          fi
          if command -v node >/dev/null 2>&1; then
            "$VENV/bin/python" scripts/test_exam_files.py
          else
            export AUDIO_PARK_NODE_DOCKER=1
            "$VENV/bin/python" scripts/test_exam_files.py
          fi
          "$VENV/bin/python" scripts/ci_smoke.py
          "$VENV/bin/python" scripts/test_recording_pauses.py

      - name: Browser recording recovery
        run: |
          docker build -t audio_park-browser-tests:latest -f scripts/Dockerfile.browser-tests scripts
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --shm-size=256m --user "$(id -u):$(id -g)" -e CI_CHROMIUM_NO_SANDBOX=1 \
            -v "$PWD:/workspace" -w /workspace audio_park-browser-tests:latest \
            node scripts/test_recording_cache_browser.cjs

  # Выкладка на lab-сервер (https://msr25.ru/audio_park/) после зелёного smoke в main.
  # Данные (results.json, results/) и .env лежат в ~/audio_park и не трогаются.
  deploy:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t audio_park-api:latest .

      - name: Restart container
        run: docker compose -p audio_park -f docker-compose.prod.yml --project-directory "$HOME/audio_park" up -d --no-build

      - name: Wait for the app
        run: |
          for i in $(seq 1 30); do
            if wget -q -O /dev/null http://127.0.0.1:5005/healthz; then
              echo "app is up"; exit 0
            fi
            sleep 2
          done
          docker logs --tail 50 parkinson_api
          exit 1
